{{- if .Values.gatewayApi.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sentry-webhook
  {{- if or .Values.gatewayApi.annotations .Values.gatewayApi.commonAnnotations }}
  {{ $annotations := merge .Values.gatewayApi.annotations .Values.gatewayApi.commonAnnotations }}
  annotations: {{ toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.gatewayApi.parentRefs }}
    - {{ toYaml (merge (dict) . (dict "group" "gateway.networking.k8s.io" "kind" "Gateway")) | nindent 6 | trim }}
    {{- end }}
  {{- if .Values.gatewayApi.hostnames }}
  hostnames:
    {{- toYaml .Values.gatewayApi.hostnames | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gatewayApi.pathType }}
            value: {{ .Values.gatewayApi.path }}
      {{- if .Values.gatewayApi.filters }}
      filters:
        {{- toYaml .Values.gatewayApi.filters | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: sentry-webhook
          port: 80
          weight: 1
{{- end }}
