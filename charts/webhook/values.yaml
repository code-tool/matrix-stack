name: webhook
replicas: 1
image:
  repository: "ghcr.io/code-tool/matrix-stack/webhook"
  tag: "0.1.0"
  pullPolicy: IfNotPresent
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
service:
  annotations:
    cloud.google.com/neg: '{"ingress":false}'
#integration parameters
matrix:
  id: ""
  password: ""
  apiKey: ""
  token: ""
ingress:
  enabled: true
  host: ""
  secretName: ""
  ingressClassName: nginx
  path: "/webhook/(.*)"
  commonAnnotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
  annotations: {}
gatewayApi:
  enabled: false
  # parentRefs:
  #   - name: my-gateway
  #     namespace: gateway-system
  #     sectionName: https
  parentRefs: []
  hostnames: []
  path: "/webhook"
  pathType: PathPrefix
  filters: []
  commonAnnotations: {}
  annotations: {}
