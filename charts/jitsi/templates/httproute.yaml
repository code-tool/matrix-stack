{{- if .Values.gatewayApi.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jitsi-web
  {{- if or .Values.gatewayApi.annotations .Values.gatewayApi.commonAnnotations }}
  {{ $annotations := merge .Values.gatewayApi.annotations .Values.gatewayApi.commonAnnotations }}
  annotations: {{ toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.gatewayApi.parentRefs }}
    - {{ toYaml (merge (dict) . (dict "group" "gateway.networking.k8s.io" "kind" "Gateway")) | nindent 6 | trim }}
    {{- end }}
  {{- if .Values.ingress.serverName }}
  hostnames:
    - {{ .Values.ingress.serverName }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /xmpp-websocket
      backendRefs:
        - group: ""
          kind: Service
          name: prosody
          port: 5280
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /colibri-ws
      backendRefs:
        - group: ""
          kind: Service
          name: jitsi-jvb
          port: 9090
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: jitsi-web
          port: 80
          weight: 1
{{- end }}
