{{- if .Values.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element-call
  labels:
    {{- include "element-call.selectorLabels" . | nindent 4 }}
  {{- if .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml .Values.gatewayApi.annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  {{- if .Values.ingress.serverName }}
  hostnames:
    - {{ .Values.ingress.serverName }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: element-call
          port: 80
{{- end }}
