{{- if .Values.admin.gatewayApi.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse-admin
  {{- if or .Values.admin.gatewayApi.annotations .Values.admin.gatewayApi.commonAnnotations }}
  {{ $annotations := merge .Values.admin.gatewayApi.annotations .Values.admin.gatewayApi.commonAnnotations }}
  annotations: {{ toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.admin.gatewayApi.parentRefs | nindent 4 }}
  {{- if .Values.admin.ingress.serverName }}
  hostnames:
    - {{ .Values.admin.ingress.serverName }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: admin
          port: 80
{{- end }}
