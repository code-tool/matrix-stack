{{- if .Values.wellKnown.gatewayApi.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: well-known
  {{- if or .Values.wellKnown.gatewayApi.annotations .Values.wellKnown.gatewayApi.commonAnnotations }}
  {{ $annotations := merge .Values.wellKnown.gatewayApi.annotations .Values.wellKnown.gatewayApi.commonAnnotations }}
  annotations: {{ toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.wellKnown.gatewayApi.parentRefs | nindent 4 }}
  {{- if .Values.synapse.serverName }}
  hostnames:
    - {{ .Values.synapse.serverName }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /\.well-known/matrix
      backendRefs:
        - name: well-known
          port: 80
{{- end }}
