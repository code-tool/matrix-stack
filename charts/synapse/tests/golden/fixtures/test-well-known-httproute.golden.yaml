---
# Source: synapse/templates/well-known-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: well-known
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: matrix-gateway
      namespace: gateway-system
  hostnames:
    - NOT-CONFIGURED
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix
      backendRefs:
        - group: ""
          kind: Service
          name: well-known
          port: 80
          weight: 1