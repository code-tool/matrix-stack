# Source: synapse/templates/matrix-authentication-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-authentication
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: matrix-gateway
      namespace: gateway-system
  hostnames:
    - NOT-CONFIGURED
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: matrix-authentication
          port: 80
          weight: 1